[project]
name = "rsa"
version = "0.1.0"
description = "Rogue Spades 2.0 sigil measurement pipeline"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.13", "orjson>=3.10", "pyarrow>=17"]

[project.scripts]
analysis = "rsa.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E501"]
